[package]
name = "dpop-replay-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "DPoP (RFC 9449) replay protection across N resource servers with clock skew: local vs shared jti cache vs server nonces, over real loopback TCP"
publish = false

[lib]
name = "dpop_replay_mesh"

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"

[profile.release]
debug = false
